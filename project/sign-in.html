<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./sign-in.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Sign in</title>
</head>
<body>
    <main class="sign-in-main"> 
        <img src="../assets/images/dashboard-logo.png" alt="Logo" class="logo" />
        <p class="sign-in-message">Please sign in </p>
        
        <form id="sign-in-form">
            <div>
                <input type="email" id="email" name="email" placeholder="Email address" />
                <input type="password" id="password" name="password" placeholder="Password" />
            </div>
            <div class="save-loggin">
                <input type="checkbox" name="save-loggin-checkbox" id="save-loggin-checkbox"/>
                <label for="save-loggin-checkbox" class="save-loggin-text">Remember me</label>
            </div>
            <p>
                Don't have an account, <a class="signup-link" href="./sign-up.html">click here!</a>   
            </p>
            <button type="submit" class="btn">Sign in</button>
        </form>

        <p class="sign-in-footer">&copy;2025 - Rikkei Education</p>
    </main>

    <div id="msg">
        <div id="login-validation" class="hidden">
            <div class="login-validation-header">
                <i class="fa-solid fa-circle-minus"></i>
                <p>Error</p>
                <div class="close-btn" id="close-validation-btn" style="cursor: pointer;">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
            </div>

            <div class="login-validation-content">
                <p class="email-cannot-blank hidden">Email không được bỏ trống</p>
                <p class="password-cannot-blank hidden">Mật khẩu không được bỏ trống</p>
            </div>
        </div>

        <div id="login-toast" class="hidden">
            <i class="fa-solid fa-circle-check"></i>
            <span class="toast-title">Đăng nhập thành công</span>
        </div>
 
        <div id="login-error" class="hidden">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span class="error-title">Email hoặc mật khẩu không tồn tại.</span>
        </div>
    </div>

    <script src="./sign-in.js"></script>
</body>
</html>
